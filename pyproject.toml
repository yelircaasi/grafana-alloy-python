[project]
name = "grafana_alloy"
version = "1.21.3"
description = "Python wrapper for Grafana Alloy"
authors = [{name = "Isaac Riley", email = "yelircaasi@proton.me"}]
readme = "README.md"
requires-python = ">=3.11,<3.16"

[dependency-groups]
test = ["pytest >= 8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_alloy"]
