name: Secure Build and Publish Alloy Wrapper

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Version from pyproject.toml
        id: version
        run: |
          ALLOY_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${ALLOY_VERSION}" >> $GITHUB_OUTPUT
          echo "Targeting Alloy version: ${ALLOY_VERSION}"

      - name: Build Wheel using uv
        run: |
          uv build --wheel

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1