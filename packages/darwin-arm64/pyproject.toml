[project]
name = "alloy-wrapper-darwin-arm64"
version = "1.21.3"  # Matches Grafana Alloy version v1.21.3
description = "Grafana Alloy binary wheel for Darwin arm64"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy_wrapper_darwin_arm64"]
